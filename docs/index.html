<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoogleBrowser</title>
  <!-- iframe에는 워커(app.js의 PROXY_URL) 주소만 들어갈 수 있게 한다. 코드가 실수로 다른 주소를 넣어도 브라우저가 막는다 -->
  <meta http-equiv="Content-Security-Policy" content="frame-src https://protect.ljh240310.date">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <button type="button" id="back" title="뒤로 (W, Alt+←)">←</button>
    <button type="button" id="forward" title="앞으로 (Alt+→)">→</button>
    <button type="button" id="reload" title="새로고침 (F5)">⟳</button>
    <button type="button" id="home" title="홈">Home</button>
    <form id="address-form" class="address">
      <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="URL 또는 검색어 입력">
      <button type="submit">Go</button>
    </form>
    <button type="button" id="proxy-key" title="프록시 접근 키 설정">🔑</button>
  </header>

  <main id="viewport" tabindex="-1">
    <!-- 다른 사이트가 이 페이지 자체를 다른 주소로 바꿔 버리지 못하도록 allow-top-navigation은 주지 않는다.
         새 창은 프록시 밖에서 열리므로 allow-popups도 주지 않는다 -->
    <iframe
      id="frame"
      title="페이지"
      sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"
      allow="fullscreen; clipboard-write"
    ></iframe>
    <!-- 밝기 조절용 검은 막. 클릭·스크롤은 아래 iframe으로 통과시킨다 -->
    <div id="dimmer"></div>
  </main>

  <footer class="statusbar">
    <span id="spinner" class="spinner" hidden></span>
    <span id="status">준비</span>
    <!-- 기본 19%는 이전 WinForms 버전의 창 투명도 기본값과 동일 -->
    <label class="brightness" title="화면 밝기">
      밝기
      <input id="brightness" type="range" min="10" max="100" value="19">
      <output id="brightness-value" for="brightness">19%</output>
    </label>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
