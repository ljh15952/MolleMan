# 배포 주소: https://<name>.<계정 서브도메인>.workers.dev 와 아래 routes의 내 도메인
name = "proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 내 도메인으로도 연다. ljh240310.date의 DNS가 Cloudflare에 있어야 하며, DNS 레코드와 인증서는 배포할 때 자동으로 만들어진다
routes = [
  { pattern = "protect.ljh240310.date", custom_domain = true },
]

# 접근 키는 저장소에 올리지 않도록 secret으로 넣는다: npx wrangler secret put ACCESS_KEY
# (영문·숫자·_·- 16자 이상. 설정하지 않으면 워커가 아무 요청도 받지 않는다)
# 모든 사이트를 대신 가져온다. 페이지 안의 이미지·CSS 등도 전부 워커를 거친다
