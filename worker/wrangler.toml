# 배포 주소: https://<name>.<계정 서브도메인>.workers.dev 와 아래 routes의 내 도메인
name = "proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 내 도메인으로도 연다. ljh240310.date의 DNS가 Cloudflare에 있어야 하며, DNS 레코드와 인증서는 배포할 때 자동으로 만들어진다
routes = [
  { pattern = "protect.ljh240310.date", custom_domain = true },
]

[vars]
# 페이지로 열 수 있는 사이트(쉼표 구분). 'tistory.com'은 하위 도메인(xxx.tistory.com)까지 포함한다.
# 목록에 없는 사이트(이미지·CSS를 주는 CDN 포함)는 프록시 없이 원래 주소로 보낸다. 비워 두면 모든 사이트를 프록시한다
ALLOWED_HOSTS = "github.io,tistory.com,ljh240310.date"
